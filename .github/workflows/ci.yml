name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · unit · i18n · build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Dummy env so `prisma generate` + `next build` don't complain about
      # missing vars. This job needs no live services.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-dummy-auth-secret-${{ github.run_id }}
      AUTH_URL: http://localhost:3000
      APP_SECRET: ci-dummy-app-secret-${{ github.run_id }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Prisma generate
        # The generated client lives in src/generated/prisma and is
        # git-ignored — typecheck, tests and build all import it.
        run: npx prisma generate

      - name: Typecheck
        # tsc OOMs with the default heap on this codebase. Public-repo
        # ubuntu-latest runners have 4 vCPU / 16 GB RAM, so 8 GB heap fits.
        run: node --max-old-space-size=8192 ./node_modules/typescript/bin/tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: i18n parity (next-intl ru/uz)
        run: npm run i18n:check

      - name: i18n audit (mini-app inline strings)
        run: npm run i18n:audit

      - name: Build
        run: npm run build

      - name: Verify standalone output
        # Prod runs the standalone server out of a Docker image — a build
        # that silently stops emitting it would break the next deploy.
        run: |
          test -d .next/standalone || { echo "::error::missing .next/standalone"; exit 1; }
          test -f .next/standalone/server.js || { echo "::error::missing .next/standalone/server.js"; exit 1; }

      - name: Lint (non-blocking)
        # eslint currently reports ~71 pre-existing errors (mostly
        # @next/next/no-html-link-for-pages and react-compiler render rules).
        # Until that backlog is burned down this step reports but does not
        # fail the build. Make it blocking again once `npm run lint` is clean.
        continue-on-error: true
        run: npm run lint

      - name: npm audit (non-blocking)
        # This used to be a blocking step and is what kept CI red for months:
        # next-auth@5-beta / @auth/core carry known high+ advisories with no
        # compatible upstream fix yet (fixing means leaving the beta line).
        # Report-only until next-auth ships a fixed release we can adopt.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # e2e (Playwright) — intentionally NOT enabled yet.
  #
  # The suite runs locally via `npm run test:e2e:local` (see
  # tests/e2e/README.md). It is not wired into CI because a handful of a11y
  # specs currently pin REAL unfixed WCAG violations in the app (see
  # tests/e2e/21-a11y-crm.spec.ts findings: definition-list/list on
  # /crm/appointments, aria-hidden-focus on /crm/calendar,
  # aria-required-children + button-name on /crm/doctors) — the job would be
  # permanently red, and a red-by-design e2e job trains everyone to ignore CI.
  # Once those violations are fixed and the suite is green across a few local
  # runs, enable the job below (it mirrors the local script: postgres service,
  # migrate, seed, build, `next start`, playwright).
