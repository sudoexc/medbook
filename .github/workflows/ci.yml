  #   timeout-minutes: 30
  #   needs: check
  #   services:
  #     postgres:
  #       image: postgres:16-alpine
  #       env:
  #         POSTGRES_USER: medbook
  #         POSTGRES_PASSWORD: medbook
  #         POSTGRES_DB: medbook_e2e
  #       ports: ["5432:5432"]
  #       options: >-
  #         --health-cmd="pg_isready -U medbook -d medbook_e2e"
  #         --health-interval=5s --health-timeout=5s --health-retries=10
  #   env:
  #     DATABASE_URL: postgresql://medbook:medbook@localhost:5432/medbook_e2e
  #     DATABASE_URL_TEST: postgresql://medbook:medbook@localhost:5432/medbook_e2e
