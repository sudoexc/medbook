# MedBook / NeuroFax — development + production docker-compose.
#
# Production:
#   docker compose up -d --build
#   docker compose exec app npx prisma migrate deploy
#
# Services:
#   postgres  — primary Postgres database
#   redis     — BullMQ queue + SSE fan-out pub/sub
#   minio     — S3-compatible object storage (clinic files; internal only,
#               never proxied to the internet, see nginx/nginx.conf)
#   app       — Next.js standalone server
#   worker    — background workers (notifications + scheduler + exports)
#   nginx     — reverse proxy + TLS termination
#   certbot   — Let's Encrypt renewal sidecar
#
# Named volumes persist data across `docker compose down`:
#   pgdata, redisdata, miniodata, letsencrypt

name: medbook

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medbook}
      POSTGRES_USER: ${POSTGRES_USER:-medbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medbook}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medbook} -d ${POSTGRES_DB:-medbook}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No ports published in prod — app talks over the compose network.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    expose:
      - "6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    # No default credentials (audit INF-07): a forgotten .env must fail the
    # start, not bring MinIO up under a key pair printed in this file.
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    expose:
      - "9000"
      - "9001"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medbook}:${POSTGRES_PASSWORD:-medbook}@postgres:5432/${POSTGRES_DB:-medbook}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-medbook}:${POSTGRES_PASSWORD:-medbook}@postgres:5432/${POSTGRES_DB:-medbook}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      # api.telegram.org resolves to IPv6 (2001:67c:4e8:f004::9) on this VPS;
      # docker bridge has no IPv6 → undici fetch hangs and TG polling fails.
      # Force IPv4 first so getUpdates can reach Telegram.
      NODE_OPTIONS: --dns-result-order=ipv4first
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Audit INF-01: the worker touches this file every 30s
    # (src/server/observability/worker-heartbeat.ts). Older than 2 min means
    # the process or its event loop is stuck; `docker compose ps` shows it.
    # /api/health judges each loop on its own from the Redis heartbeats.
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/medbook-worker.heartbeat');process.exit(Date.now()-s.mtimeMs<120000?0:1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - letsencrypt:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
    depends_on:
      - app

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./nginx/www:/var/www/certbot
      # Audit INF-03: certbot runs every executable in renewal-hooks/deploy
      # after each certificate it renews (the loop below and a manual
      # `certbot renew` alike). The hook only drops a flag in the shared
      # volume: this container has no Docker access. The host cron
      # (ops/nginx-reload-on-renew.sh, ops/crontab.example) sees the flag and
      # reloads nginx, which otherwise kept serving the old certificate from
      # memory until the next deploy happened to reload it.
      - ./ops/certbot/request-nginx-reload.sh:/etc/letsencrypt/renewal-hooks/deploy/medbook-request-nginx-reload.sh:ro
    # Renewal loop: try every 12h; the deploy hook above asks for the reload.
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done'

volumes:
  pgdata:
  redisdata:
  miniodata:
  letsencrypt:
